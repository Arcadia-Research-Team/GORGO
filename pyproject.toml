[project]
# Distribution name: PyPI's "gorgo" is squatted (dormant since 2025-02); the
# import name stays `gorgo` (see [tool.hatch.build.targets.wheel]).
name = "gorgo-lb"
version = "0.2.0"
license = "MIT"
description = "Prefix-cache-, load-, and network-aware routing for LLM replica fleets, with online weight tuning"
readme = "README.md"
authors = [{ name = "Alessio Toniolo", email = "alessio@modal.com" }]
requires-python = ">=3.11"
# The shipped package (gorgo/) is stdlib-only by design: routing policies,
# radix trie, ES tuner, OLS calibration, and SSE measurement all duck-type
# their transport so downstream routers choose their own HTTP stack.
dependencies = []

[project.optional-dependencies]
# The reference proxy (proxy/modal_proxy.py) and its workload/calibration
# drivers -- not shipped in the wheel, but installable for development.
proxy = [
    "httpx>=0.28.1",
    "modal>=1.4.0",
    "transformers>=4.48.0",
    "uvicorn>=0.44.0",
]
# Trace building, benchmarking, and paper analysis (data_processing/,
# experiment_runner/).
analysis = [
    "duckdb>=1.5.2",
    "guidellm>=0.6.0",
    "matplotlib>=3.9.0",
    "numpy>=2.4.4",
    "seaborn>=0.13.0",
    "tiktoken>=0.12.0",
]

[project.urls]
Repository = "https://github.com/atoniolo76/GORGO"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gorgo"]
exclude = ["*_test.py"]

[tool.pytest.ini_options]
testpaths = ["gorgo"]  # colocated: foo_test.py sits beside foo.py
python_files = ["*_test.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
